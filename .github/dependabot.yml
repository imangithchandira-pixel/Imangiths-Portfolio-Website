# Weekly pull requests for dependency updates, plus immediate ones for any
# security advisory. Astro and its packages are grouped so they move together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      everything-else:
        patterns: ['*']
        exclude-patterns: ['astro', '@astrojs/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
