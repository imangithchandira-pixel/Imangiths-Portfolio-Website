# Weekly pull requests for dependency updates, plus immediate ones for any
# security advisory. Astro and its packages are grouped so they move together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      everything-else:
        patterns: ['*']
        exclude-patterns: ['astro', '@astrojs/*']
    ignore:
      # @astrojs/check supports TypeScript 5 and 6 only; take a new major when it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
