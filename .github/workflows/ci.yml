# Checks every pull request and every push to main: types, a clean build, a
# dependency audit, and the end-to-end tests in Chromium at desktop and phone
# sizes. Vercel deploys separately; this tells you whether a change is safe.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Type-check
        run: npx astro check

      - name: Cache optimised images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro
          key: astro-images-${{ hashFiles('src/assets/img/**', 'astro.config.mjs', 'package-lock.json') }}
          restore-keys: astro-images-

      - name: Build
        run: npm run build

      - name: Install Chromium for the tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm test
        env:
          CI: true

      - name: Keep the test report if anything failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
